name: Refresh Live Market Indices
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_live_indices.py'
      - '.github/workflows/refresh-live-indices.yml'
permissions:
  contents: write
concurrency:
  group: nasdecode-live-indices
  cancel-in-progress: false
jobs:
  indices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect timestamped display-only market quotes
        run: |
          python -m py_compile scripts/collect_live_indices.py
          python scripts/collect_live_indices.py
      - name: Publish lightweight indices JSON
        run: |
          git config user.name nasdecode-bot
          git config user.email actions@users.noreply.github.com
          git add public/data/live-indices.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update live index and futures quotes'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
          done
          exit 1
