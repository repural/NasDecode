name: Analyze Semiconductor Earnings Lead-up

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_earnings_leadup.py'
      - 'data/earnings_avwap_watchlist.json'
  workflow_dispatch:

concurrency:
  group: nasboard-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze earnings lead-up
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/analyze_earnings_leadup.py
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/earnings_leadup_analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "Store semiconductor earnings lead-up analysis"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
