name: Validate Decision Engines
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild model chain
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python scripts/build_resilience_history.py
          python scripts/build_resilience_model.py
          python scripts/build_resilience_engine.py
          python scripts/backtest_resilience_engine.py
          python scripts/build_directional_edge.py
          python scripts/backtest_directional_edge.py
          python scripts/backtest_directional_edge_walkforward.py
      - name: Persist validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/resilience-daily.json data/history/resilience-model.json data/history/resilience-engine.json data/history/resilience-backtest.json data/history/directional-edge.json data/history/directional-edge-backtest.json data/history/directional-edge-walkforward.json
          git diff --cached --quiet || git commit -m "Validate decision engines"
          git push
