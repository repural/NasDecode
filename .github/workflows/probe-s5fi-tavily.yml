name: Probe S5FI via Tavily
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_s5fi_tavily.py
      - .github/workflows/probe-s5fi-tavily.yml
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * 1-5'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and cross-check S5FI
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY }}
        run: python scripts/probe_s5fi_tavily.py
      - name: Persist labeled historical baseline
        if: success()
        run: |
          git config user.name 'NasDecode Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git pull --rebase origin main
          git add data/history/s5fi-single-provider.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update S5FI single-provider historical observations'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main || exit 1
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s5fi-tavily-probe
          path: data/history/s5fi-tavily-observations.json
          if-no-files-found: warn
