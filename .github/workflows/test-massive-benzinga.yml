name: Test Massive Benzinga Access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-massive-benzinga.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Tavily secret availability
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "TAVILY secret MISSING"
            exit 1
          fi
          echo "TAVILY secret PRESENT"

      - name: Test earnings and guidance entitlements
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          key=os.environ["MASSIVE_API_KEY"]
          tests=[
            ("earnings","https://api.massive.com/benzinga/v1/earnings",{"ticker":"NVDA","date":"2026-08-26","limit":"2"}),
            ("guidance","https://api.massive.com/benzinga/v1/guidance",{"ticker":"NVDA","date":"2026-08-26","limit":"2"}),
          ]
          failed=False
          for name,base,params in tests:
            url=base+"?"+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={"Authorization":"Bearer "+key,"User-Agent":"NasBoard/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                data=json.load(r)
                rows=data.get("results",[])
                print(name.upper(),"HTTP",r.status,"status",data.get("status"),"count",len(rows))
                if rows:
                  print(name.upper(),"FIELDS",sorted(rows[0].keys()))
            except urllib.error.HTTPError as e:
              body=e.read().decode("utf-8",errors="replace")
              print(name.upper(),"HTTP",e.code,"BODY",body[:1000])
              failed=True
            except Exception as e:
              print(name.upper(),"ERROR",type(e).__name__,str(e))
              failed=True
          if failed:
            raise SystemExit(2)
          PY

# trigger
