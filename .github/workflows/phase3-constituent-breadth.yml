name: Phase 3 Constituent Breadth Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_phase3_constituent_breadth.py'
      - 'scripts/analyze_phase3_breadth_divergence.py'
      - 'scripts/analyze_phase3_breadth_recovery.py'
      - '.github/workflows/phase3-constituent-breadth.yml'
permissions:
  contents: write
concurrency:
  group: phase3-constituent-breadth
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate script
        run: python -m py_compile scripts/backfill_phase3_constituent_breadth.py
      - name: Backfill dated adjusted closes
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/backfill_phase3_constituent_breadth.py
      - name: Analyze breadth divergence and missing symbols
        run: python scripts/analyze_phase3_breadth_divergence.py
      - name: Analyze current-constituent breadth recovery
        run: python scripts/analyze_phase3_breadth_recovery.py
      - name: Persist research-only dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated datasets must be applied to the latest main, not rebased as concurrent JSON edits.
          # Fetch once per attempt and replace only the two generated artifacts.
          cp data/history/phase3-constituent-breadth.json /tmp/phase3-breadth.json
          cp data/history/phase3-breadth-divergence-research.json /tmp/phase3-divergence.json
          cp data/history/phase3-breadth-recovery-research.json /tmp/phase3-recovery.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/phase3-breadth.json data/history/phase3-constituent-breadth.json
            cp /tmp/phase3-divergence.json data/history/phase3-breadth-divergence-research.json
            cp /tmp/phase3-recovery.json data/history/phase3-breadth-recovery-research.json
            git add data/history/phase3-constituent-breadth.json data/history/phase3-breadth-divergence-research.json data/history/phase3-breadth-recovery-research.json
            git diff --cached --quiet && exit 0
            git commit -m "Persist Phase 3 semiconductor breadth history"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
