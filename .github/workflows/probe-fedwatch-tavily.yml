name: Probe FedWatch via Tavily (Hourly)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_fedwatch_tavily.py'
      - '.github/workflows/probe-fedwatch-tavily.yml'
  schedule:
    - cron: '12 12-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: nasdecode-fedwatch-tavily-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate strict FedWatch table parser
        run: |
          python -m py_compile scripts/probe_fedwatch_tavily.py
          python -m unittest discover -s tests -p test_fedwatch_tavily.py -v
      - name: Probe CME aggregated FedWatch with Tavily
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY }}
        run: python scripts/probe_fedwatch_tavily.py
      - name: Persist only diagnostic evidence (never override Fed scoring)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nasdecode-bot
          git config user.email actions@users.noreply.github.com
          cp data/research/fedwatch-tavily-probe.json /tmp/fedwatch-tavily-probe.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/research
            cp /tmp/fedwatch-tavily-probe.json data/research/fedwatch-tavily-probe.json
            git add data/research/fedwatch-tavily-probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Probe hourly CME FedWatch aggregation via Tavily'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
