name: Analyze Mega-cap Earnings History

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_megacap_earnings.py'
  workflow_dispatch:

concurrency:
  group: nasboard-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze mega-cap earnings history
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/analyze_megacap_earnings.py
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/megacap_earnings_analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "Store 2026 mega-cap earnings history"
          git pull --rebase origin main
          git push
