name: Enrich Earnings Fundamentals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_earnings_fundamentals.py'
permissions:
  contents: write
concurrency:
  group: nasboard-data-refresh
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enrich earnings fundamentals
        env:
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
        run: python scripts/enrich_earnings_fundamentals.py
      - name: Commit enriched histories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/earnings_leadup_analysis.json data/history/megacap_earnings_analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "Enrich historical earnings fundamentals"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
