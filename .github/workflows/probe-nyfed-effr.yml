name: Probe NY Fed EFFR
on:
  push:
    branches:
      - feature-fedwatch-card-20260924
    paths:
      - '.github/workflows/probe-nyfed-effr.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NY Fed data hub
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.newyorkfed.org/markets/data-hub/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode('utf-8',errors='replace')
          print("HTTP_OK bytes",len(html))
          text=re.sub(r'<script.*?</script>',' ',html,flags=re.I|re.S)
          text=re.sub(r'<style.*?</style>',' ',text,flags=re.I|re.S)
          text=re.sub(r'<[^>]+>',' ',text)
          text=re.sub(r'&nbsp;|&#160;',' ',text)
          text=re.sub(r'\s+',' ',text)
          for needle in ['target rate/range','9/22/2026','3.88']:
              i=text.lower().find(needle.lower())
              print('NEEDLE',needle,'INDEX',i)
              if i>=0: print(text[max(0,i-500):i+1600])
          PY
