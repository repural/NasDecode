name: Validate NasDecode Code
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/index.html'
      - 'scripts/**/*.py'
      - 'scripts/*.py'
      - 'tests/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'public/index.html'
      - 'scripts/**/*.py'
      - 'scripts/*.py'
      - 'tests/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nasdecode-code-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python (no data collection)
        run: python -m compileall -q scripts tests
      - name: Offline S5FI and CNBC quote regression tests
        run: |
          python -m unittest discover -s tests -p 'test_s5fi_parser.py' -v
          python -m unittest discover -s tests -p 'test_cnbc_change.py' -v
          python -m unittest discover -s tests -p 'test_live_oil.py' -v

      - name: Stored SMA and AVWAP research regression tests
        run: |
          python -m unittest discover -s tests -p 'test_daily_bars_sma.py' -v
          python -m unittest discover -s tests -p 'test_avwap_sma_reader.py' -v
      - name: Verify sole ownership of historical bars
        run: python -m unittest discover -s tests -p 'test_daily_bars_ownership.py' -v
      - name: Validate dashboard embedded JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ("index.html","public/index.html"):
              html=Path(name).read_text()
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",html)
              for i,src in enumerate(scripts):
                  if not src.strip(): continue
                  Path(f"/tmp/nasdecode-{name.replace('/','-')}-{i}.js").write_text(src)
          PY
          shopt -s nullglob
          files=(/tmp/nasdecode-*.js)
          test "${#files[@]}" -gt 0
          for js in "${files[@]}"; do node --check "$js"; done

      - name: Validate Shannon-inspired AVWAP setup screens
        run: python -m unittest discover -s tests -p 'test_avwap_setups.py' -v
