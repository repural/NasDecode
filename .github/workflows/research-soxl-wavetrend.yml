name: Research SOXL WaveTrend 4H 8H and Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_soxl_wavetrend.py'
      - 'scripts/backtest_wavetrend.py'
      - 'tests/test_backtest_wavetrend.py'
      - '.github/workflows/research-soxl-wavetrend.yml'
permissions:
  contents: write
concurrency:
  group: nasdecode-soxl-wavetrend
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector and backtest logic
        run: |
          python -m py_compile scripts/research_soxl_wavetrend.py scripts/backtest_wavetrend.py
          python -m unittest discover -s tests -p test_nvda_wavetrend.py -v
          python -m unittest discover -s tests -p test_backtest_wavetrend.py -v
      - name: Collect full year of SOXL 5m bars and compute 4h and 8h WaveTrend
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/research_soxl_wavetrend.py --days 365
      - name: Verify SOXL historical coverage and candle integrity
        run: |
          python - <<'PYCODE'
          import json
          import math
          from collections import Counter
          from pathlib import Path
          doc = json.loads(Path("data/research/soxl-wavetrend.json").read_text())
          assert doc["symbol"] == "SOXL" and not doc["fetchErrors"]
          summaries = []
          for tf, expected in (("4h", 48), ("8h", 96)):
              series = doc["timeframes"][tf]
              rows = series["candles"]
              starts = [row["startET"] for row in rows]
              assert starts == sorted(set(starts)), "Duplicate or unsorted candles: " + tf
              assert len(rows) == series["candleCount"] and len(rows) > 100
              assert all(row["underlying5mBars"] == expected for row in rows), "Incomplete source bars: " + tf
              assert all(all(math.isfinite(row[k]) and row[k] > 0 for k in ("open", "high", "low", "close")) for row in rows)
              assert all(row["low"] <= min(row["open"], row["close"]) <= max(row["open"], row["close"]) <= row["high"] for row in rows)
              summaries.append(f"{tf}: {len(rows)} candles; {starts[0]} through {rows[-1]['endET']}; {len(Counter(x[:10] for x in starts))} sessions")
          assert doc["timeframes"]["4h"]["lastEndET"] == doc["timeframes"]["8h"]["lastEndET"]
          print("\n".join(summaries))
          PYCODE
      - name: Simulate both SOXL strategies and hold comparison
        run: python scripts/backtest_wavetrend.py --input data/research/soxl-wavetrend.json --output data/research/soxl-wavetrend-backtest.json
      - name: Upload complete SOXL WaveTrend and backtest as recoverable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soxl-wavetrend-full-year
          path: |
            data/research/soxl-wavetrend.json
            data/research/soxl-wavetrend-backtest.json
          retention-days: 30
      - name: Commit research-only artifacts safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nasdecode-bot
          git config user.email actions@users.noreply.github.com
          cp data/research/soxl-wavetrend.json /tmp/soxl-wavetrend.json
          cp data/research/soxl-wavetrend-backtest.json /tmp/soxl-wavetrend-backtest.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/soxl-wavetrend.json data/research/soxl-wavetrend.json
            cp /tmp/soxl-wavetrend-backtest.json data/research/soxl-wavetrend-backtest.json
            git add data/research/soxl-wavetrend.json data/research/soxl-wavetrend-backtest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist full-year SOXL 4h and 8h WT Cross LB research and ten-thousand-dollar backtest'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
