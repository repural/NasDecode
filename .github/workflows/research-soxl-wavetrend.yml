name: Research SOXL WaveTrend 4H 8H and Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_soxl_wavetrend.py'
      - 'scripts/backtest_wavetrend.py'
      - 'tests/test_backtest_wavetrend.py'
      - '.github/workflows/research-soxl-wavetrend.yml'
permissions:
  contents: write
concurrency:
  group: nasdecode-soxl-wavetrend
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector and backtest logic
        run: |
          python -m py_compile scripts/research_soxl_wavetrend.py scripts/backtest_wavetrend.py
          python -m unittest discover -s tests -p test_nvda_wavetrend.py -v
          python -m unittest discover -s tests -p test_backtest_wavetrend.py -v
      - name: Collect full year of SOXL 5m bars and compute 4h and 8h WaveTrend
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/research_soxl_wavetrend.py --days 365
      - name: Simulate both SOXL strategies and hold comparison
        run: python scripts/backtest_wavetrend.py --input data/research/soxl-wavetrend.json --output data/research/soxl-wavetrend-backtest.json
      - name: Commit research-only artifacts safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nasdecode-bot
          git config user.email actions@users.noreply.github.com
          cp data/research/soxl-wavetrend.json /tmp/soxl-wavetrend.json
          cp data/research/soxl-wavetrend-backtest.json /tmp/soxl-wavetrend-backtest.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/soxl-wavetrend.json data/research/soxl-wavetrend.json
            cp /tmp/soxl-wavetrend-backtest.json data/research/soxl-wavetrend-backtest.json
            git add data/research/soxl-wavetrend.json data/research/soxl-wavetrend-backtest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Persist full-year SOXL 4h 8h WT Cross LB and $10k backtest"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
