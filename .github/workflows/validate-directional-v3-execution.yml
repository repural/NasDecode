name: Validate Directional v3 Execution
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_directional_v3_nonoverlap.py'
      - '.github/workflows/validate-directional-v3-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  non-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check non-overlap execution semantics
        run: python -m unittest discover -s tests -p 'test_directional_v3_nonoverlap.py' -v
      - name: Calculate non-overlap results from stored market history
        run: python scripts/backtest_directional_v3_nonoverlap.py
      - uses: actions/upload-artifact@v4
        with:
          name: directional-v3-nonoverlap-report
          path: data/history/directional-v3-nonoverlap-backtest.json
          retention-days: 30
