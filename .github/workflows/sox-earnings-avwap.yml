name: SOX Earnings AVWAP Research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sox_earnings_avwap.py'
      - 'scripts/collect_sox_avwap.py'
      - 'data/sox_avwap_membership.json'
      - 'tests/test_sox_earnings_avwap.py'
      - '.github/workflows/sox-earnings-avwap.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: nasdecode-sox-avwap-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify calculations
        run: python -m unittest discover -s tests -p test_sox_earnings_avwap.py -v
      - name: Collect official-snapshot universe diagnostics
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m scripts.collect_sox_avwap
      - name: Commit diagnostics (recompute after competing pushes)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name nasdecode-bot
          git config user.email actions@users.noreply.github.com
          for n in 1 2 3 4; do
            # Each attempt starts from current main, not stale generated JSON.
            # Rebuild the daily record so previous published dates are preserved.
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.collect_sox_avwap
            mkdir -p public/data
            cp data/sox_avwap_latest.json public/data/sox_avwap_latest.json
            git add data/sox_avwap_latest.json data/history/sox-avwap-daily.json public/data/sox_avwap_latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Store daily SOX earnings AVWAP diagnostics"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update detected (attempt $n); recomputing from latest main"
          done
          exit 1
