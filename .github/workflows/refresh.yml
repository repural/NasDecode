name: Refresh NasDecode
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/dashboard.json'
      - 'data/cnbc_probe.json'
      - 'data/history/**'
      - 'history/**'
      - 'public/history/**'
      - 'data/macro-surprises.json'
      - 'public/data/dashboard.json'
      - 'public/data/premarket.json'
      - 'public/data/session-research.json'
      - 'data/research/session-briefs.json'
      - '.github/workflows/publish-session-research.yml'
      - 'public/index.html'
      - '.github/workflows/test-*.yml'
      # Independent research/workflow maintenance must not cancel an active refresh.
      - '.github/workflows/sox-earnings-avwap.yml'
      - '.github/workflows/probe-s5fi-tavily.yml'
      - '.github/workflows/backfill-regime-macro-2025.yml'
      - '.github/workflows/probe-massive-oil-futures.yml'
      - '.github/workflows/validate-directional-v3-2025.yml'
      - '.github/workflows/validate-engines.yml'
      - 'scripts/sox_earnings_avwap.py'
      - 'scripts/collect_sox_avwap.py'
      - 'scripts/collect_daily_bars.py'
      - 'scripts/collect_intraday_avwap.py'
      - '.github/workflows/intraday-avwap-research.yml'
      - 'data/research/intraday-avwap.json'
      - 'public/data/intraday-avwap.json'
      - '.github/workflows/collect-daily-bars.yml'
      - 'scripts/probe_s5fi_tavily.py'
      - 'scripts/audit_data.py'
      - '.github/workflows/audit-data.yml'
      # Tests and validation-only automation must never start a market refresh.
      - 'tests/**'
      - '.github/workflows/validate-code.yml'
      - 'docs/**'
      - 'README.md'
      - 'scripts/backfill_regime_macro_2025.py'
      - 'scripts/analyze_oil_pressure.py'
  workflow_dispatch:
  schedule:
    # 06:00 Türkiye pre-market research/data snapshot.
    - cron: '0 3 * * 1-5'
    # 04:15 ET pre-market refresh. Both UTC hours are scheduled so this remains
    # correct across U.S. daylight-saving changes; the ET gate admits only the right one.
    - cron: '15 8,9 * * 1-5'
    # Pre-open recovery watchdogs. Dual UTC hours cover EDT/EST; ET gate below
    # admits 07:30, 08:30 and 09:10 ET. These ensure a failed early snapshot is
    # regenerated and published before the cash open.
    - cron: '30 11,12,13 * * 1-5'
    - cron: '10 13,14 * * 1-5'
    # Cash-session heartbeat every 5 minutes. GitHub cron is UTC; the ET gate below
    # limits execution to the U.S. session. Explicit checkpoint crons below prevent
    # GitHub's 5-minute cron jitter from skipping named analysis windows.
    - cron: '*/5 12-22 * * 1-5'
    - cron: '30 14,15 * * 1-5' # 10:30 ET across EDT/EST
    - cron: '0 17,18 * * 1-5'  # 13:00 ET across EDT/EST
    - cron: '30 19,20 * * 1-5' # 15:30 ET across EDT/EST
    # Extra post-close trigger improves close-snapshot reliability if the heartbeat is delayed.
    # Dual UTC hours cover EDT/EST; the New York gate admits only the applicable run.
    - cron: '27 20,21 * * 1-5'
concurrency:
  group: nasboard-data-refresh
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow refresh
        id: gate
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_hm=$(TZ=America/New_York date +%H%M)
          if { [ "$ny_hm" -ge 0725 ] && [ "$ny_hm" -le 0735 ]; } || { [ "$ny_hm" -ge 0825 ] && [ "$ny_hm" -le 0845 ]; } || { [ "$ny_hm" -ge 0905 ] && [ "$ny_hm" -le 0915 ]; } || { [ "$ny_hm" -ge 0930 ] && [ "$ny_hm" -le 1620 ]; }; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            tr_hm=$(TZ=Europe/Istanbul date +%H%M)
            if { [ "$tr_hm" -ge 0550 ] && [ "$tr_hm" -le 0615 ]; } || { [ "$ny_hm" -ge 0405 ] && [ "$ny_hm" -le 0430 ]; } || { [ "$ny_hm" -ge 1605 ] && [ "$ny_hm" -le 1645 ]; }; then
              echo "run=yes" >> "$GITHUB_OUTPUT"
            else
              echo "run=no" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Validate Python syntax
        if: steps.gate.outputs.run == 'yes'
        run: python -m compileall -q scripts
      - name: Install FedWatch dependency
        if: steps.gate.outputs.run == 'yes'
        run: pip install 'cme-fedwatch==0.2.1'
      - name: Refresh data
        if: steps.gate.outputs.run == 'yes'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY }}
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          ny_hm=$(TZ=America/New_York date +%H%M)
          if [ "$ny_hm" -ge 1605 ] && [ "$ny_hm" -le 1645 ]; then
            export NASDECODE_CLOSE_SNAPSHOT=1
            echo "Capturing canonical post-close NasDecode snapshot"
          fi
          python scripts/refresh_macro_surprises.py
          python scripts/verify_macro_actuals.py
          python scripts/refresh.py
          python scripts/sync_premarket_brief.py
          python scripts/publish_session_research.py
          python scripts/live_confirmation.py
          python scripts/apply_market_response.py
          python scripts/refine_scores.py
          python scripts/reconcile_premarket_scores.py
          python scripts/fix_three_day_watch.py
          export NASDECODE_ANALYSIS_STAGE=$(python scripts/select_session_checkpoint.py)
          python scripts/capture_session_analysis.py
          python scripts/verify_session_checkpoint.py
          python scripts/build_chart_history.py
          python scripts/build_hype_history.py
          python scripts/build_resilience_history.py
          python scripts/build_resilience_model.py
          python scripts/build_resilience_engine.py
          python scripts/backtest_resilience_engine.py
          python scripts/build_directional_edge.py
          python scripts/backtest_directional_edge.py
          python scripts/backtest_directional_edge_walkforward.py
          python scripts/build_directional_regimes_v2.py
          python scripts/backtest_directional_regimes_v2.py
          python scripts/research_directional_v3.py
          python scripts/build_directional_engine_v3.py
          python scripts/validate_directional_engine_v3_holdout.py
          python scripts/build_regime_context_dataset.py
          python scripts/analyze_regime_context.py
          python scripts/build_context_engine_v1.py
          python scripts/track_directional_v3_prospective.py
      - name: Commit refreshed snapshot
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          git config user.name 'nasdecode-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A data
          mkdir -p public/data public/history
          cp index.html public/index.html
          python scripts/inject_session_analysis_ui.py public/index.html
          cp data/dashboard.json public/data/dashboard.json
          cp data/history/chart-history.json public/data/chart-history.json
          cp data/history/market-watch-events.json public/history/market-watch-events.json
          cp data/premarket.json public/data/premarket.json
          cp data/history/session-analyses.json public/data/session-analyses.json
          git add -A public/data/session-research.json
          git add -A public/index.html public/data
          if [ -f data/cnbc_probe.json ]; then git add data/cnbc_probe.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh dashboard data'
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push raced with main; regenerate from latest main (attempt $attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            export MASSIVE_API_KEY='${{ secrets.MASSIVE_API_KEY }}'
            export TAVILY_API_KEY='${{ secrets.TAVILY_KEY }}'
            export TRADING_ECONOMICS_API_KEY='${{ secrets.TRADING_ECONOMICS_API_KEY }}'
            python scripts/refresh_macro_surprises.py
            python scripts/verify_macro_actuals.py
            python scripts/refresh.py
            python scripts/sync_premarket_brief.py
            python scripts/publish_session_research.py
            python scripts/live_confirmation.py
            python scripts/apply_market_response.py
            python scripts/refine_scores.py
            python scripts/reconcile_premarket_scores.py
            python scripts/fix_three_day_watch.py
            export NASDECODE_ANALYSIS_STAGE=$(python scripts/select_session_checkpoint.py)
            python scripts/capture_session_analysis.py
            python scripts/verify_session_checkpoint.py
            python scripts/build_chart_history.py
            python scripts/build_hype_history.py
            python scripts/build_resilience_history.py
            python scripts/build_resilience_model.py
            python scripts/build_resilience_engine.py
            python scripts/backtest_resilience_engine.py
            python scripts/build_directional_edge.py
            python scripts/backtest_directional_edge.py
            python scripts/backtest_directional_edge_walkforward.py
            python scripts/build_directional_regimes_v2.py
            python scripts/backtest_directional_regimes_v2.py
            python scripts/research_directional_v3.py
            python scripts/build_directional_engine_v3.py
            python scripts/validate_directional_engine_v3_holdout.py
            python scripts/build_regime_context_dataset.py
            python scripts/analyze_regime_context.py
            python scripts/build_context_engine_v1.py
            python scripts/track_directional_v3_prospective.py
            mkdir -p public/data public/history
            cp index.html public/index.html
            python scripts/inject_session_analysis_ui.py public/index.html
            cp data/dashboard.json public/data/dashboard.json
            cp data/history/chart-history.json public/data/chart-history.json
            cp data/history/market-watch-events.json public/history/market-watch-events.json
            cp data/premarket.json public/data/premarket.json
            cp data/history/session-analyses.json public/data/session-analyses.json
            git add -A data public/index.html public/data public/history
            if [ -f data/cnbc_probe.json ]; then git add data/cnbc_probe.json; fi
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh dashboard data after push race'
          done
          echo "Unable to publish refreshed data after 4 attempts"
          exit 1

# validation-trigger: serialized-refresh-v1
