name: Refresh NasDecode
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/dashboard.json'
      - 'data/cnbc_probe.json'
      - 'data/history/**'
      - 'public/data/dashboard.json'
      - 'public/index.html'
      - '.github/workflows/test-*.yml'
  workflow_dispatch:
  schedule:
    # Daily pre-market snapshot at 06:00 Türkiye time.
    - cron: '0 6 * * 1-5'
      timezone: 'Europe/Istanbul'
    # True U.S. pre-market refresh after extended-hours trading begins.
    - cron: '15 4 * * 1-5'
      timezone: 'America/New_York'
    # Resilient U.S.-session heartbeat. UTC intentionally spans both EDT and EST;
    # the gate below decides from America/New_York time whether a refresh is useful.
    # Repeated hourly opportunities recover automatically if GitHub delays one schedule.
    - cron: '7 13-21 * * 1-5'
# Serialize all dashboard refreshes. Multiple overlapping refreshes were both
# consuming the Massive free-tier quota and racing to push generated snapshots.
# queue:max preserves scheduled/manual runs instead of cancelling an in-progress refresh.
concurrency:
  group: nasboard-data-refresh
  queue: max

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow refresh
        id: gate
        shell: bash
        run: |
          # Push/manual runs always refresh. Scheduled heartbeat runs only during the
          # useful U.S. window: shortly after the open through the official close.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_hm=$(TZ=America/New_York date +%H%M)
          if [ "$ny_hm" -ge 0930 ] && [ "$ny_hm" -le 1620 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            # Dedicated 06:00 Türkiye and 04:15 ET schedules must still run.
            tr_hm=$(TZ=Europe/Istanbul date +%H%M)
            if { [ "$tr_hm" -ge 0550 ] && [ "$tr_hm" -le 0615 ]; } || { [ "$ny_hm" -ge 0405 ] && [ "$ny_hm" -le 0430 ]; }; then
              echo "run=yes" >> "$GITHUB_OUTPUT"
            else
              echo "run=no" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install FedWatch dependency
        if: steps.gate.outputs.run == 'yes'
        run: pip install 'cme-fedwatch==0.2.1'
      - name: Refresh data
        if: steps.gate.outputs.run == 'yes'
        env:
          # Massive is optional enrichment: the secret never enters the repository or public assets.
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/refresh.py
      - name: Commit refreshed snapshot
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          git config user.name 'nasdecode-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard.json data/premarket.json data/history
          mkdir -p public/data
          cp index.html public/index.html
          cp data/dashboard.json public/data/dashboard.json
          cp data/premarket.json public/data/premarket.json
          git add public/index.html public/data/dashboard.json public/data/premarket.json
          if [ -f data/cnbc_probe.json ]; then git add data/cnbc_probe.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh dashboard data'
          # A code/UI commit or another data refresh can land while this run is
          # generating data. Retry from the newest main and regenerate instead of
          # rebasing generated snapshots, which can create history conflicts.
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push raced with main; regenerating from latest main (attempt $attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            MASSIVE_API_KEY='${{ secrets.MASSIVE_API_KEY }}' python scripts/refresh.py
            git add data/dashboard.json data/premarket.json data/history
            mkdir -p public/data
            cp index.html public/index.html
            cp data/dashboard.json public/data/dashboard.json
            cp data/premarket.json public/data/premarket.json
            git add public/index.html public/data/dashboard.json public/data/premarket.json
            if [ -f data/cnbc_probe.json ]; then git add data/cnbc_probe.json; fi
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh dashboard data'
          done
          echo "Unable to publish refreshed data after 4 attempts"
          exit 1

# validation-trigger: serialized-refresh-v1
