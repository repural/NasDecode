name: Refresh NasBoard
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/dashboard.json'
      - 'data/cnbc_probe.json'
  workflow_dispatch:
  schedule:
    # Use New York time directly so DST does not require UTC candidate schedules.
    # Run a few minutes after the cash open so equity quote feeds have populated.
    - cron: '35 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '35 10 * * 1-5'
      timezone: 'America/New_York'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow refresh
        id: gate
        run: echo "run=yes" >> "$GITHUB_OUTPUT"
      - name: Refresh data
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/refresh.py
      - name: Commit refreshed snapshot
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          git config user.name 'nasboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard.json
          if [ -f data/cnbc_probe.json ]; then git add data/cnbc_probe.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh dashboard data'
          git push
