name: Refresh NasBoard
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/dashboard.json'
      - 'data/cnbc_probe.json'
      - 'data/history/**'
      - 'public/data/dashboard.json'
      - 'public/index.html'
  workflow_dispatch:
  schedule:
    # Daily pre-market snapshot at 06:00 Türkiye time.
    - cron: '0 6 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Use New York time directly so DST does not require UTC candidate schedules.
    # Run a few minutes after the cash open so equity quote feeds have populated.
    - cron: '35 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '35 10 * * 1-5'
      timezone: 'America/New_York'
    # Continue checking material 3-Day Watch changes through the U.S. cash session.
    - cron: '5 11-15 * * 1-5'
      timezone: 'America/New_York'
    # After-close snapshot captures official regular-session closing levels.
    - cron: '10 16 * * 1-5'
      timezone: 'America/New_York'
# Serialize all dashboard refreshes. Multiple overlapping refreshes were both
# consuming the Massive free-tier quota and racing to push generated snapshots.
# queue:max preserves scheduled/manual runs instead of cancelling an in-progress refresh.
concurrency:
  group: nasboard-data-refresh
  queue: max

permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow refresh
        id: gate
        run: echo "run=yes" >> "$GITHUB_OUTPUT"
      - name: Install FedWatch dependency
        if: steps.gate.outputs.run == 'yes'
        run: pip install 'cme-fedwatch==0.2.1'
      - name: Refresh data
        if: steps.gate.outputs.run == 'yes'
        env:
          # Massive is optional enrichment: the secret never enters the repository or public assets.
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/refresh.py
      - name: Commit refreshed snapshot
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          git config user.name 'nasboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard.json data/history
          mkdir -p public/data
          cp index.html public/index.html
          cp data/dashboard.json public/data/dashboard.json
          git add public/index.html public/data/dashboard.json
          if [ -f data/cnbc_probe.json ]; then git add data/cnbc_probe.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh dashboard data'
          # A code/UI commit or another data refresh can land while this run is
          # generating data. Retry from the newest main and regenerate instead of
          # rebasing generated snapshots, which can create history conflicts.
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push raced with main; regenerating from latest main (attempt $attempt/4)"
            git fetch origin main
            git reset --hard origin/main
            MASSIVE_API_KEY='${{ secrets.MASSIVE_API_KEY }}' python scripts/refresh.py
            git add data/dashboard.json data/history
            mkdir -p public/data
            cp index.html public/index.html
            cp data/dashboard.json public/data/dashboard.json
            git add public/index.html public/data/dashboard.json
            if [ -f data/cnbc_probe.json ]; then git add data/cnbc_probe.json; fi
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh dashboard data'
          done
          echo "Unable to publish refreshed data after 4 attempts"
          exit 1

# validation-trigger: serialized-refresh-v1
