name: Monitor Major Catalysts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_catalysts.py'
      - 'scripts/refresh_market_watch.py'
      - 'scripts/market_watch_global.py'
      - 'tests/test_market_watch_global.py'
      - 'scripts/validate_open_watch.py'
      - 'scripts/refresh_upcoming_earnings.py'
      - 'scripts/build_hype_history.py'
      - 'data/catalyst-universe.json'
      - '.github/workflows/catalyst-monitor.yml'
  schedule:
    # Asia session: 30-minute cadence so severe regional semiconductor shocks are not delayed.
    - cron: '*/30 0-8 * * 1-5'
    # Europe transition: hourly scan until the main U.S. monitoring window begins.
    - cron: '0 9-10 * * 1-5'
    # U.S. pre-market/regular/after-hours window: retain the existing 30-minute cadence.
    - cron: '*/30 11-23 * * 1-5'

concurrency:
  group: nasdecode-catalyst-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover raw catalyst candidates
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY }}
        run: |
          python scripts/refresh_catalysts.py
          python scripts/refresh_upcoming_earnings.py

      - name: Curate and persist Market Watch events
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_KEY }}
        run: |
          python scripts/refresh_market_watch.py
          python scripts/validate_open_watch.py
          python scripts/build_hype_history.py
          mkdir -p public/history
          cp data/history/market-watch-events.json public/history/market-watch-events.json

      - name: Publish discovery and curated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nasdecode-bot'
          git config user.email 'actions@users.noreply.github.com'

          git add             data/semiconductor-catalysts.json             data/upcoming-earnings.json             data/history/market-watch-events.json             data/research/market-watch-monitor-status.json             public/data/market-watch.json             public/history/market-watch-events.json             data/history/hype-daily.json

          git diff --cached --quiet && exit 0
          git commit -m 'Update market catalysts and curated Open Watch history'

          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi

            git fetch origin main
            git reset --hard origin/main

            TAVILY_API_KEY='${{ secrets.TAVILY_KEY }}' python scripts/refresh_catalysts.py
            python scripts/refresh_upcoming_earnings.py
            TAVILY_API_KEY='${{ secrets.TAVILY_KEY }}' python scripts/refresh_market_watch.py
            python scripts/validate_open_watch.py
            python scripts/build_hype_history.py
            mkdir -p public/history
            cp data/history/market-watch-events.json public/history/market-watch-events.json

            git add               data/semiconductor-catalysts.json               data/upcoming-earnings.json               data/history/market-watch-events.json               data/research/market-watch-monitor-status.json               public/data/market-watch.json               public/history/market-watch-events.json               data/history/hype-daily.json

            git diff --cached --quiet && exit 0
            git commit -m 'Update market catalysts and curated Open Watch history'
          done

          echo "Unable to publish catalyst updates after 4 attempts"
          exit 1
