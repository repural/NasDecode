name: Probe Massive Oil Futures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_massive_oil_futures.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover Brent and WTI futures products
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/probe_massive_oil_futures.py
      - uses: actions/upload-artifact@v4
        with:
          name: massive-oil-futures-probe
          path: data/history/massive-oil-futures-probe.json
